{% extends 'college/college_index.html' %}
{% block body %}

<head>
    <title>Add Dataset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container my-5 d-flex justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Add Dataset Entry</h4>
            </div>

            <form action="/myapp/add_dataset_post/" method="post" class="p-4">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Question</label>
                    <input type="text" name="question" class="form-control" placeholder="Enter question" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Answer</label>
                    <input type="text" name="answer" class="form-control" placeholder="Enter answer" required>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Add</button>
                </div>
            </form>

        </div>

    </div>
</div>

</body>

{% endblock %}
