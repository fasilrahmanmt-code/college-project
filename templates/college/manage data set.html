{% extends 'college/college_index.html' %}
{% block body %}

<head>
    <title>Manage Dataset</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container my-5">

    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Manage Dataset</h4>
            <a href="/myapp/data_set_form/#main" class="btn btn-light btn-sm">
                ➕ Add New
            </a>
        </div>

        <div class="card-body p-4">

            <table class="table table-hover table-bordered align-middle">
                <thead class="table-primary">
                    <tr>
                        <th style="width: 40%">Question</th>
                        <th style="width: 40%">Answer</th>
                        <th style="width: 20%">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for i in data %}
                    <tr>
                        <td>{{ i.question }}</td>
                        <td>{{ i.answer }}</td>
                        <td>
                            <a href="/myapp/delete_dataset/{{ i.id }}" class="btn btn-danger btn-sm">
                                Delete
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4">
                            No dataset entries found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>
    </div>

</div>

</body>

{% endblock %}
