{% extends 'college/college_index.html' %}
{% block body %}

<head>
    <title>Add Mark</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-success text-white text-center">
                        <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Add Mark Details</h4>
                    </div>
                    <div class="card-body">
                        <form action="/myapp/add_mark_post/" method="post" class="needs-validation" novalidate>
                            {% csrf_token %}

                            <!-- Course Selection -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Course</label>
                                <select name="course" class="form-select" required>
                                    <option value="">-- Select Course --</option>
                                    {% for i in data %}
                                    <option value="{{ i.id }}">{{ i.COURSE.course }}</option>
                                    {% endfor %}
                                </select>
                                <div class="invalid-feedback">Please select a course.</div>
                            </div>

                            <!-- Year -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Year</label>
                                <input name="year" type="number" class="form-control" placeholder="Enter year" required>
                                <div class="invalid-feedback">Please enter a valid year.</div>
                            </div>

                            <!-- Mark Starting -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mark Starting</label>
                                <input name="strt_mrk" type="number" class="form-control" placeholder="Enter starting mark" required>
                                <div class="invalid-feedback">Please enter starting mark.</div>
                            </div>

                            <!-- Mark Ending -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mark Ending</label>
                                <input name="endmrk" type="number" class="form-control" placeholder="Enter ending mark" required>
                                <div class="invalid-feedback">Please enter ending mark.</div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">
                                    <i class="bi bi-check-circle me-1"></i> Add Mark
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Bootstrap Validation Script -->
    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>

{% endblock %}
