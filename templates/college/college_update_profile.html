{% extends 'college/college_index.html' %}
{% block body %}
<head>
    <title>Profile</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Profile</h4>
                    </div>
                    <div class="card-body">
                        <form action="/myapp/college_edit_profile_post/" method="post" enctype="multipart/form-data">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" value="{{ data.name }}" placeholder="Enter college name" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Place</label>
                                <input type="text" name="place" class="form-control" value="{{ data.place }}" placeholder="Enter place" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ data.email }}" placeholder="Enter email address" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="number" name="phone" class="form-control" value="{{ data.phone }}" placeholder="Enter phone number" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Proof</label>
                                <input type="file" name="proof" class="form-control">

                            </div>


                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">UPDATE</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
{% endblock %}
