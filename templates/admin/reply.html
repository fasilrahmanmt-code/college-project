{% extends 'admin/admin_index.html' %}
{% block body %}

<head>
    <title>Reply</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Send Reply</h4>
                    </div>
                    <div class="card-body">
                        <form action="/myapp/send_reply_post/" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="reply" class="form-label">Reply Message</label>
                                <input type="text" id="reply" name="reply" class="form-control" placeholder="Enter your reply" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Send Reply</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

{% endblock %}
