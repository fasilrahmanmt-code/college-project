{% extends 'admin/admin_index.html' %}
{% block body %}

<head>
    <title>Send Notification</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Send Notification</h4>
                    </div>
                    <div class="card-body">
                        <form action="/myapp/edit_notification_post/" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Notification</label>
                                <input type="text" name="notification" class="form-control" value="{{ data.Notification }}" placeholder="Enter notification" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Details</label>
                                <input type="text" name="details" class="form-control" value="{{ data.details }}" placeholder="Enter details" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Update</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

{% endblock %}
