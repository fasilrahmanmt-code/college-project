{% extends 'admin/admin_index.html' %}
{% block body %}

<head>
    <title>Add Department</title>
    <!-- Bootstrap CSS (only include if not already in base template) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Edit Job</h4>
                    </div>
                    <div class="card-body">
                        <form action="/myapp/edit_jobpost/" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Job Title</label>
                                <input type="text" name="job_title" value="{{ i.job_title }}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Company</label>
                                <input type="text" name="company" value="{{ i.company }}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Qualification</label>
                                <input type="text" name="qualification" value="{{ i.qualification }}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" name="start_date" value="{{ i.start_date|date:'Y-m-d' }}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">End Date</label>
                                <input type="date" name="end_date" value="{{ i.last_date|date:'Y-m-d' }}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Postion</label>
                                <input type="text" name="position" value="{{ i.position }}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">No: Vacancy</label>
                                <input type="number" name="no_vacancy" value="{{ i.no_vacancy }}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Link</label>
                                <input type="text" name="link" value="{{ i.link }}" class="form-control" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Update</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

{% endblock %}
