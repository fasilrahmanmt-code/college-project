{% extends 'admin/admin_index.html' %}
{% block body %}

<head>
    <title>Department</title>
    <!-- Include Bootstrap CSS if not already included in base template -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container my-5">
    <h2 class="text-primary mb-4">Departments</h2>

    <table class="table table-bordered table-hover shadow-sm">
        <thead class="table-primary">
            <tr align="center">
                <th scope="col">Department</th>
                <th scope="col">Details</th>
                <th scope="col" colspan="2">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for i in data %}
            <tr>
                <td>{{ i.department }}</td>
                <td>{{ i.details }}</td>
                <td>
                    <a href="/myapp/manage_course/{{ i.id }}/#main" class="btn btn-sm btn-outline-primary mb-1">Manage Course</a></td>
                    <td><a href="/myapp/DeleteDepartment/{{ i.id }}/" class="btn btn-sm btn-outline-danger">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/myapp/add_department/#main" class="btn btn-primary">Add New Department</a>
</div>

</body>
{% endblock %}
