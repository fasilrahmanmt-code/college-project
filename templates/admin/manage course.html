{% extends 'admin/admin_index.html' %}
{% block body %}

<head>
    <title>Manage Courses</title>
    <!-- Bootstrap CSS (skip if already in base template) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Manage Courses</h4>
            </div>
            <div class="card-body">
                <table class="table table-bordered table-hover">
                    <thead class="table-primary">
                        <tr>
                            <th>Course</th>
                            <th>Details</th>
                            <th>Fees</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for course in data %}
                        <tr>
                            <td>{{ course.course }}</td>
                            <td>{{ course.details }}</td>
                            <td>{{ course.fee }}</td>
                            <td>
                                <a href="/myapp/edit_course/{{ course.id }}/#main" class="btn btn-sm btn-outline-secondary mb-1">Edit</a><br>
                                <a href="/myapp/DeleteCourse/{{ course.id }}/" class="btn btn-sm btn-outline-danger">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">No courses available.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <a href="/myapp/add_course/#main" class="btn btn-primary mt-3">Add New Course</a>
            </div>
        </div>
    </div>
</body>

{% endblock %}
