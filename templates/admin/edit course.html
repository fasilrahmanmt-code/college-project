{% extends 'admin/admin_index.html' %}
{% block body %}

<head>
    <title>Add Course</title>
    <!-- Include Bootstrap CSS if not already included in base template -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Edit Course</h4>
                    </div>
                    <div class="card-body">
                        <form action="/myapp/editCoursePost/" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Course</label>
                                <input type="text" name="course" class="form-control" value="{{ data.course }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Details</label>
                                <input type="text" name="details" class="form-control" value="{{ data.details }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fee</label>
                                <input type="number" name="fees" class="form-control" value="{{ data.fee }}" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Edit Course</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

{% endblock %}
