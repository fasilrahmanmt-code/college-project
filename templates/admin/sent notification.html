{% extends 'admin/admin_index.html' %}
{% block body %}

<head>
    <title>Notifications</title>
    <!-- Include Bootstrap CSS if not already included -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Notifications</h4>
                        <a href="/myapp/add_notification/#main" class="btn btn-light btn-sm">+ Add New</a>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered table-striped align-middle text-center">
                            <thead class="table-primary">
                                <tr>
                                    <th>Notification</th>
                                    <th>Details</th>
                                    <th>date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for n in notifications %}
                                <tr>
                                    <td>{{ n.Notification }}</td>
                                    <td>{{ n.details }}</td>
                                    <td>{{ n.Date }}</td>
                                    <td>
                                        <a href="/myapp/edit_notification/{{ n.id }}/#main" class="btn btn-sm btn-warning me-1">Edit</a>
                                        <a href="/myapp/delete_notification/{{ n.id }}/" class="btn btn-sm btn-danger">Delete</a>
                                    </td>
                                </tr>
                                {% empty %}
                                <tr>
                                    <td colspan="4" class="text-muted">No notifications available.</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

{% endblock %}
