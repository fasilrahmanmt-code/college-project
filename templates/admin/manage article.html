{% extends 'admin/admin_index.html' %}
{% block body %}

<head>
    <title>Manage Articles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        a {
            text-decoration: none;
            color: #2196F3;
            font-weight: bold;
        }

        a:hover {
            color: #0b7dda;
        }

        .add-new {
            margin-top: 10px;
            display: inline-block;
            padding: 8px 12px;
            background-color: #4CAF50;
            color: white;
            border-radius: 6px;
        }

        .add-new:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <h2>Manage Articles</h2>
    <table>
        <tr>
            <th>Article Title</th>
            <th>Subject</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
        {% for i in data %}
        <tr>
            <td>{{ i.article_title }}</td>
            <td>{{ i.article_subject }}</td>
            <td>{{ i.Date }}</td>
            <td><a href="/myapp/delete_article/{{ i.id }}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
    <a href="/myapp/add_article/#main" class="add-new">Add New Article</a>
</body>

{% endblock %}
